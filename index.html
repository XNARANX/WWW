<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#161616">
<title>XNAR</title>
<style>
  :root{
    --bg:#161616; --fg:#e0e0e0; --dim:#8a8a8a; --acc:#4caf50;
    --you:#7fc8ff; --panel:#1f1f1f; --line:#2c2c2c;
  }
  *{ box-sizing:border-box; }
  html, body{
    height:100%; margin:0;
    background:var(--bg); color:var(--fg);
    font:16px/1.45 system-ui, sans-serif;
  }
  body{
    display:flex; align-items:center; justify-content:center;
    padding:
      env(safe-area-inset-top) env(safe-area-inset-right)
      env(safe-area-inset-bottom) env(safe-area-inset-left);
  }
  .logo{
    font-family: Consolas, "Courier New", monospace;
    font-weight: 700;
    letter-spacing: .18em;
    color: var(--acc);
    font-size: clamp(48px, 18vw, 160px);
    line-height: 1;
    text-align: center;
    user-select: none;
    -webkit-user-select: none;
    /* мягкое свечение в тон акцента */
    text-shadow: 0 0 24px rgba(76,175,80,.25);
  }
</style>
</head>
<body>
  <div class="logo" role="heading" aria-level="1">XNAR</div>
</body>
</html>
