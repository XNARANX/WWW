<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Drift</title>
<style>
  html,body{margin:0;height:100%;background:#03040b;color:#9fb4d0;font-family:ui-monospace,"SF Mono",Menlo,Consolas,"DejaVu Sans Mono",monospace;overflow:hidden}
  canvas{position:fixed;inset:0;width:100%;height:100%}
  #start{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;cursor:pointer;
         letter-spacing:.42em;font-size:12px;text-transform:uppercase;transition:opacity 2.5s;user-select:none;z-index:5;
         color:#b9d6ff;text-shadow:0 0 18px rgba(110,200,255,.55)}
  #start.hide{opacity:0;pointer-events:none}
  #ui{position:fixed;left:0;right:0;bottom:26px;display:flex;justify-content:center;gap:16px;
      opacity:0;pointer-events:none;transition:opacity 2s;z-index:4}
  #ui.show{opacity:1;pointer-events:auto}
  #ui button{background:rgba(10,16,34,.5);color:#a8c4e6;border:1px solid rgba(120,190,255,.28);border-radius:999px;
             padding:11px 28px;font:inherit;font-size:12px;letter-spacing:.2em;text-transform:uppercase;cursor:pointer;
             backdrop-filter:blur(6px);box-shadow:inset 0 0 22px rgba(80,160,255,.08);
             transition:background .25s,color .25s,border-color .25s,box-shadow .25s}
  #ui button:hover{border-color:rgba(140,230,255,.7);color:#e6f6ff;box-shadow:0 0 22px rgba(80,200,255,.25)}
  #ui button.on{background:rgba(110,230,255,.22);color:#fff;border-color:#8fe9ff;box-shadow:0 0 28px rgba(110,230,255,.45)}
  #info{position:fixed;left:18px;top:14px;right:18px;font-size:11px;letter-spacing:.12em;color:#6f87a8;
        opacity:0;transition:opacity 2s;user-select:none;z-index:4;line-height:1.7;pointer-events:none}
  #info.show{opacity:1}
  #scene{position:fixed;right:18px;top:48px;max-width:min(62vw,560px);text-align:right;font-size:17px;letter-spacing:.16em;
         color:#c9ebff;text-shadow:0 0 16px rgba(110,200,255,.5);opacity:0;transition:opacity 1.6s;user-select:none;z-index:4;
         pointer-events:none;line-height:1.35;font-style:italic}
  #scene.show{opacity:.92}
  @media (max-width:620px){#scene{font-size:14px;letter-spacing:.1em;top:62px}}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="info"></div>
<div id="scene"></div>
<div id="ui"><button id="no">дальше</button><button id="yes">нравится</button></div>
<div id="start">нажми, чтобы начать</div>

<script>
(() => {
  // ---------- утилиты ----------
  const rnd = (a = 0, b = 1) => a + Math.random() * (b - a);
  const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
  const lerp = (a, b, t) => a + (b - a) * t;
  const expMap = (v, lo, hi) => lo * Math.pow(hi / lo, v);
  const linMap = (v, lo, hi) => lo + (hi - lo) * v;
  const randInt = n => Math.floor(Math.random() * n);
  const pick = a => a[randInt(a.length)];
  const mtof = m => 440 * Math.pow(2, (m - 69) / 12);
  const gauss = () => {
    let u = 0, v = 0;
    while (!u) u = Math.random();
    while (!v) v = Math.random();
    return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v);
  };
  const mean = a => a.length ? a.reduce((s, x) => s + x, 0) / a.length : 0;

  // ---------- музыкальные данные ----------
  const MOODS = [
    { n: 'лидийский',         pcs: [0, 2, 4, 6, 7, 9, 11] },
    { n: 'светлый мажор',     pcs: [0, 2, 4, 5, 7, 9, 11] },
    { n: 'тёмный минор',      pcs: [0, 2, 3, 5, 7, 8, 10] },
    { n: 'пустые кварты',     pcs: [0, 2, 5, 7, 9] },
    { n: 'дорийский',         pcs: [0, 2, 3, 5, 7, 9, 10] },
    { n: 'фригийский',        pcs: [0, 1, 3, 5, 7, 8, 10] },
    { n: 'миксолидийский',    pcs: [0, 2, 4, 5, 7, 9, 10] },
    { n: 'пентатоника минор', pcs: [0, 3, 5, 7, 10] },
    { n: 'целотонный',        pcs: [0, 2, 4, 6, 8, 10] },
    { n: 'гарм. минор',       pcs: [0, 2, 3, 5, 7, 8, 11] },
  ];
  const JAZZ = [0, 1, 4, 6];
  const PROGS = [[1, 4, 0, 0], [0, 5, 1, 4], [0, 3, 1, 4], [2, 5, 1, 4], [0, 2, 3, 4], [3, 4, 2, 5]];
  const NOTES = ['до', 'до♯', 'ре', 'ре♯', 'ми', 'фа', 'фа♯', 'соль', 'соль♯', 'ля', 'ля♯', 'си'];
  const LAYERS = ['bass', 'hum', 'breath', 'water', 'wind', 'metal', 'grain',
                  'pad', 'bells', 'glass', 'muzak', 'elevator', 'micro', 'glitch', 'arp', 'bseq', 'ind', 'dungeon', 'berlin', 'lofi', 'krell'];
  const LNAMES = ['бас-дрон', 'гул', 'дыхание', 'вода', 'ветер', 'металл', 'гранулы',
                  'пэды', 'колокола', 'стекло', 'музак', 'элеватор', 'микро-минимализм', 'глитч',
                  'космические арпеджио', 'вибрирующий бас-секвенсор',
                  'индастриал', 'dungeon synth', 'берлинская школа', 'lofi / vapour', 'крелл-патч'];
  // основные стили: звучит один (на пике плотности два), между ними плавный кроссфейд
  const MAINS = ['pad', 'bass', 'elevator', 'muzak', 'micro', 'glitch', 'bells', 'glass', 'arp', 'bseq', 'ind', 'dungeon', 'berlin', 'lofi', 'krell'];
  // фон: шумы и призвуки, подмешиваются тихо поверх основного стиля
  const TEXTS = ['hum', 'breath', 'water', 'wind', 'metal', 'grain'];
  const BUSBASE = { bass: 1, hum: 0.4, breath: 0.45, water: 0.6, wind: 0.6, metal: 1.8, grain: 1.4,
                    pad: 1.7, bells: 1.8, glass: 1.8, muzak: 1, elevator: 1, micro: 1.1, glitch: 1.5, arp: 2.2, bseq: 0.9, ind: 1.2, dungeon: 0.95, berlin: 0.85, lofi: 0.55, krell: 2.0 };
  const LWEIGHT = { bass: 1, hum: 1, breath: 1, water: 1, wind: 1, metal: 1, grain: 1,
                    pad: 1.2, bells: 1.1, glass: 1, muzak: 0.9, elevator: 0.9, micro: 1, glitch: 0.6, arp: 1.3, bseq: 1.3, ind: 1.1, dungeon: 1.1, berlin: 1.2, lofi: 1.2, krell: 1.3 };
  const WNAMES = ['синус', 'пила', 'полая', 'орган', 'стекло', 'язычок', 'кларнет', 'яркая', 'пустая', 'шершавая'];
  const scaleNote = (sc, idx) => {
    const n = sc.length, o = Math.floor(idx / n), i = ((idx % n) + n) % n;
    return sc[i] + 12 * o;
  };
  const spaceName = s => s < 0.1 ? 'глухая студия' : s < 0.3 ? 'камерная комната' : s < 0.55 ? 'зал'
                       : s < 0.8 ? 'большой зал' : 'кафедрал';

  // ---------- параметры (вектор в [0..1]) ----------
  const NAMES = ['bassCut', 'bassLvl', 'bassDet',
                 'wCenter', 'wQ', 'wLvl', 'wRate', 'wColor',
                 'mLvl', 'mQ', 'mSpread', 'mBase', 'mColor',
                 'gDens', 'gSize', 'gPitch', 'gPos', 'gLvl', 'gSrc',
                 'hum', 'brQ', 'brColor', 'wnCenter', 'wnColor',
                 'glDens',
                 'dTime', 'dFb', 'dWet', 'rWet',
                 'padCut', 'padOct', 'padDens'];
  const P = {};
  NAMES.forEach(n => { const v = rnd(0.25, 0.75); P[n] = { v, t: v, rate: 0.01 }; });
  ['bassLvl', 'wLvl', 'mLvl', 'gLvl'].forEach(n => P[n].v = P[n].t = 0.55);
  P.rWet.v = P.rWet.t = 0.6;

  // =====================================================
  //   ВИЗУАЛИЗАЦИЯ: радиальная гистограмма параметров, спектр в центре
  // =====================================================
  const V = { s: null, pulses: [] };
  V.pulse = kind => V.pulses.push({ t0: performance.now(), kind });
  (() => {
    const cv = document.getElementById('c'), g = cv.getContext('2d');
    let w = 0, h = 0;
    const stars = Array.from({ length: 180 }, () => ({ x: Math.random(), y: Math.random(), r: rnd(0.5, 1.5), p: rnd(0, 6.28), f: rnd(0.2, 1.2) }));
    function resize() {
      const dpr = Math.min(2, window.devicePixelRatio || 1);
      w = innerWidth; h = innerHeight;
      cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
      g.setTransform(dpr, 0, 0, dpr, 0, 0);
    }
    addEventListener('resize', resize); resize();

    const FONT = 'ui-monospace, "SF Mono", Menlo, Consolas, "DejaVu Sans Mono", monospace';
    const COL = { main: [188, 90, 66], tex: [268, 85, 76], par: [158, 68, 64], pitch: [305, 78, 78] };
    const hsl = (c, a, dh = 0, dl = 0) => `hsla(${c[0] + dh},${c[1]}%,${clamp(c[2] + dl, 0, 100)}%,${a})`;
    const wcache = new Map();
    const textW = (str, px) => {
      const k = px + '|' + str; let v = wcache.get(k);
      if (v === undefined) { g.font = `${px}px ${FONT}`; v = g.measureText(str).width; wcache.set(k, v); }
      return v;
    };
    const wrap = a => { while (a > Math.PI) a -= 2 * Math.PI; while (a < -Math.PI) a += 2 * Math.PI; return a; };
    const M = 144;
    let disp = [], rootA = null, sp = null, ripples = [], frameN = 0, rmsS = 0, last = performance.now();
    const absVis = new Float32Array(12);

    function circle(cx, cy, r) { g.beginPath(); g.arc(cx, cy, r, 0, Math.PI * 2); }

    function draw(now) {
      requestAnimationFrame(draw);
      const dt = Math.min(0.1, Math.max(0.001, (now - last) / 1000)); last = now; frameN++;
      const t = now / 1000, s = V.s;
      const topPad = 42, botPad = w > 620 ? 72 : 84, availH = Math.max(200, h - topPad - botPad);
      const D = Math.min(w, availH), cx = w / 2, cy = topPad + availH / 2, sc = clamp(D / 900, 0.55, 1.15);
      if (s) rmsS += (s.rms() - rmsS) * 0.05;
      const energy = clamp(rmsS * 6);

      // ---- космический фон: туманности, виньетка, звёзды ----
      g.globalCompositeOperation = 'source-over';
      g.fillStyle = '#03040b'; g.fillRect(0, 0, w, h);
      const blobs = [
        [0.28 + 0.10 * Math.sin(t * 0.05), 0.32 + 0.08 * Math.cos(t * 0.04), 0.62, [252, 75, 26], 0.55],
        [0.74 + 0.08 * Math.cos(t * 0.045), 0.66 + 0.10 * Math.sin(t * 0.05), 0.55, [188, 85, 24], 0.45],
        [0.50 + 0.14 * Math.sin(t * 0.03), 0.92, 0.50, [310, 70, 26], 0.38]];
      for (const [bx, by, br, c, a] of blobs) {
        const X = bx * w, Y = by * h, rr = br * Math.max(w, h);
        const gr = g.createRadialGradient(X, Y, 0, X, Y, rr);
        gr.addColorStop(0, `hsla(${c[0]},${c[1]}%,${c[2]}%,${a * (0.8 + 0.5 * energy)})`);
        gr.addColorStop(1, `hsla(${c[0]},${c[1]}%,${c[2]}%,0)`);
        g.fillStyle = gr; g.fillRect(0, 0, w, h);
      }
      const vg = g.createRadialGradient(cx, cy, D * 0.3, cx, cy, Math.max(w, h) * 0.75);
      vg.addColorStop(0, 'rgba(0,0,0,0)'); vg.addColorStop(1, 'rgba(0,0,0,0.6)');
      g.fillStyle = vg; g.fillRect(0, 0, w, h);
      for (const st of stars) {
        const a = 0.2 + 0.5 * (0.5 + 0.5 * Math.sin(t * st.f + st.p));
        g.fillStyle = `rgba(200,222,255,${a})`;
        g.fillRect(((st.x + t * 0.002 * st.r) % 1) * w, st.y * h, st.r, st.r);
      }

      // ---- до старта: только мягкая «орбита» ----
      if (!s) {
        const r0 = D * 0.11 * (1 + 0.06 * Math.sin(t * 0.8));
        const og = g.createRadialGradient(cx, cy, 0, cx, cy, r0 * 2.2);
        og.addColorStop(0, 'hsla(190,90%,70%,0.35)'); og.addColorStop(1, 'hsla(270,80%,60%,0)');
        g.fillStyle = og; circle(cx, cy, r0 * 2.2); g.fill();
        g.strokeStyle = 'hsla(190,90%,75%,0.35)'; g.lineWidth = 1; circle(cx, cy, r0); g.stroke();
        g.setLineDash([2, 7]); g.lineDashOffset = -t * 6; g.strokeStyle = 'hsla(300,80%,80%,0.25)'; circle(cx, cy, r0 * 1.5); g.stroke(); g.setLineDash([]);
        return;
      }

      // ---- геометрия колец ----
      const items = s.items, N = items.length;
      const Rout = D / 2 - 10 * sc, lab = 112 * sc;
      const rb1 = Rout - lab, rb0 = rb1 * 0.5;
      const rPitch = rb0 * 0.86, rSpec = rb0 * 0.46, spMax = rb0 * 0.34;
      const hue = s.hue();

      if (disp.length !== N) disp = items.map(it => it.val());
      const kd = 1 - Math.exp(-dt / 0.22);
      for (let i = 0; i < N; i++) disp[i] += (items[i].val() - disp[i]) * kd;

      // ---- каркас: окружности, риски ----
      g.lineWidth = 1;
      g.strokeStyle = 'rgba(150,185,255,0.10)'; circle(cx, cy, rb0); g.stroke(); circle(cx, cy, rb1); g.stroke();
      g.strokeStyle = 'rgba(150,185,255,0.045)'; circle(cx, cy, (rb0 + rb1) / 2); g.stroke();
      const nTick = 120;
      for (let i = 0; i < nTick; i++) {
        const aa = (i / nTick) * Math.PI * 2 + t * 0.008, long = i % 10 === 0;
        const r0 = rb1 + 3 * sc, r1 = r0 + (long ? 7 : 3.5) * sc;
        g.strokeStyle = long ? 'rgba(160,200,255,0.34)' : 'rgba(160,200,255,0.16)';
        g.beginPath(); g.moveTo(cx + Math.cos(aa) * r0, cy + Math.sin(aa) * r0); g.lineTo(cx + Math.cos(aa) * r1, cy + Math.sin(aa) * r1); g.stroke();
      }

      // ---- радиальная гистограмма: сегментные столбцы с целью и стрелкой направления ----
      const slot = (Math.PI * 2) / N, nseg = 14, len = rb1 - rb0, segL = len / nseg;
      const bw = clamp(rb0 * slot * 0.3, 2.2, 10);
      g.lineCap = 'butt';
      for (let i = 0; i < N; i++) {
        const it = items[i], a = -Math.PI / 2 + (i + 0.5) * slot, ca = Math.cos(a), sa = Math.sin(a);
        const v = clamp(disp[i]), tv = clamp(it.tgt()), col = COL[it.group], px = -sa, py = ca;
        g.globalCompositeOperation = 'source-over';
        g.lineWidth = 1; g.strokeStyle = hsl(col, 0.06);
        g.beginPath(); g.moveTo(cx + ca * rb0, cy + sa * rb0); g.lineTo(cx + ca * rb1, cy + sa * rb1); g.stroke();
        g.lineWidth = bw;
        for (let k = 0; k < nseg; k++) {
          const lit = clamp(v * nseg - k);
          const r0 = rb0 + k * segL + 0.8, r1 = rb0 + (k + 1) * segL - 2;
          g.strokeStyle = lit > 0 ? hsl(col, 0.22 + 0.7 * lit, k * 2.2, 4 * lit) : hsl(col, 0.07);
          g.beginPath(); g.moveTo(cx + ca * r0, cy + sa * r0); g.lineTo(cx + ca * r1, cy + sa * r1); g.stroke();
        }
        const tipR = rb0 + len * v;
        if (v > 0.02) {
          g.globalCompositeOperation = 'lighter';
          g.lineWidth = bw * 2.6; g.strokeStyle = hsl(col, 0.05 + 0.06 * v);
          g.beginPath(); g.moveTo(cx + ca * rb0, cy + sa * rb0); g.lineTo(cx + ca * tipR, cy + sa * tipR); g.stroke();
          g.fillStyle = hsl(col, 0.95, 0, 14); circle(cx + ca * tipR, cy + sa * tipR, bw * 0.55); g.fill();
          g.globalCompositeOperation = 'source-over';
        }
        // цель: засечка + стрелка «растёт / падает»
        const rt = rb0 + len * tv, diff = tv - v, moving = Math.abs(diff) > 0.03, mw = bw * 0.95;
        g.lineWidth = 1.4; g.strokeStyle = `hsla(0,0%,100%,${moving ? 0.8 : 0.26})`;
        g.beginPath(); g.moveTo(cx + ca * rt - px * mw, cy + sa * rt - py * mw); g.lineTo(cx + ca * rt + px * mw, cy + sa * rt + py * mw); g.stroke();
        if (moving) {
          const dir = diff > 0 ? 1 : -1, cc = diff > 0 ? [150, 85, 70] : [345, 88, 72];
          g.lineWidth = 1; g.strokeStyle = hsl(cc, 0.3);
          g.beginPath(); g.moveTo(cx + ca * tipR, cy + sa * tipR); g.lineTo(cx + ca * rt, cy + sa * rt); g.stroke();
          const rc = rb0 + len * (v + tv) / 2, ap = rc + dir * 4.5 * sc, wr = rc - dir * 2.5 * sc, ww = 4.5 * sc;
          g.lineWidth = 1.6; g.strokeStyle = hsl(cc, 0.5 + 0.4 * Math.sin(t * 4 + i));
          g.beginPath();
          g.moveTo(cx + ca * wr - px * ww, cy + sa * wr - py * ww);
          g.lineTo(cx + ca * ap, cy + sa * ap);
          g.lineTo(cx + ca * wr + px * ww, cy + sa * wr + py * ww);
          g.stroke();
        }
        // подпись вдоль луча, читаемая в обеих половинах круга
        const left = ca < -0.001;
        const vs = it.fmt ? it.fmt(v) : String(Math.round(v * 100));
        const avail = lab - 16 * sc;
        let px0 = Math.max(8, Math.round(11 * sc)), txt = it.label + '  ' + vs;
        if (textW(txt, px0) > avail) txt = it.label;
        while (px0 > 7 && textW(txt, px0) > avail) px0--;
        g.save();
        g.translate(cx + ca * (rb1 + 13 * sc), cy + sa * (rb1 + 13 * sc));
        g.rotate(left ? a + Math.PI : a);
        g.font = `${px0}px ${FONT}`; g.textAlign = left ? 'right' : 'left'; g.textBaseline = 'middle';
        g.fillStyle = hsl(col, 0.34 + 0.62 * v, 0, 14);
        g.fillText(txt, 0, 0);
        g.restore();
      }

      // ---- кольцо ступеней лада: «созвездие» плавно перестраивается вместе со звуком ----
      const rootN = s.root(), cur = s.cur();
      const rootT = -Math.PI / 2 + rootN * Math.PI / 6;
      if (rootA === null) rootA = rootT;
      rootA += wrap(rootT - rootA) * (1 - Math.exp(-dt / 1.0));
      const kv = 1 - Math.exp(-dt / 0.9);
      for (let pc = 0; pc < 12; pc++) absVis[pc] += ((cur[(((pc - rootN) % 12) + 12) % 12] ? 1 : 0) - absVis[pc]) * kv;
      g.setLineDash([2 * sc, 6 * sc]); g.lineDashOffset = -t * 6;
      g.strokeStyle = hsl(COL.pitch, 0.2); g.lineWidth = 1; circle(cx, cy, rPitch); g.stroke();
      g.setLineDash([]);
      const act = []; for (let pc = 0; pc < 12; pc++) if (absVis[pc] > 0.2) act.push(pc);
      if (act.length > 1) {
        g.lineWidth = 1;
        for (let j = 0; j < act.length; j++) {
          const p0 = act[j], p1 = act[(j + 1) % act.length];
          const a0 = -Math.PI / 2 + p0 * Math.PI / 6, a1 = -Math.PI / 2 + p1 * Math.PI / 6;
          g.strokeStyle = hsl(COL.pitch, 0.5 * Math.min(absVis[p0], absVis[p1]));
          g.beginPath(); g.moveTo(cx + Math.cos(a0) * rPitch, cy + Math.sin(a0) * rPitch); g.lineTo(cx + Math.cos(a1) * rPitch, cy + Math.sin(a1) * rPitch); g.stroke();
        }
      }
      const nfs = Math.max(7, Math.round(9 * sc));
      for (let pc = 0; pc < 12; pc++) {
        const aa = -Math.PI / 2 + pc * Math.PI / 6, vis = absVis[pc];
        const X = cx + Math.cos(aa) * rPitch, Y = cy + Math.sin(aa) * rPitch;
        g.fillStyle = hsl(COL.pitch, 0.18 + 0.8 * vis, 0, 10 * vis); circle(X, Y, (2 + 4.5 * vis) * sc); g.fill();
        g.font = `${nfs}px ${FONT}`; g.textAlign = 'center'; g.textBaseline = 'middle';
        g.fillStyle = hsl(COL.pitch, 0.22 + 0.6 * vis, 0, 10);
        g.fillText(NOTES[pc], cx + Math.cos(aa) * (rPitch - 15 * sc), cy + Math.sin(aa) * (rPitch - 15 * sc));
      }
      {
        const X = cx + Math.cos(rootA) * rPitch, Y = cy + Math.sin(rootA) * rPitch;
        g.globalCompositeOperation = 'lighter';
        const rg = g.createRadialGradient(X, Y, 0, X, Y, 20 * sc);
        rg.addColorStop(0, hsl(COL.pitch, 0.55)); rg.addColorStop(1, hsl(COL.pitch, 0));
        g.fillStyle = rg; circle(X, Y, 20 * sc); g.fill();
        g.globalCompositeOperation = 'source-over';
        g.lineWidth = 1.5; g.strokeStyle = hsl(COL.pitch, 0.95, 0, 8); circle(X, Y, 9 * sc); g.stroke();
      }

      // ---- «залип» (после лайка): дуга обратного отсчёта ----
      const lk = s.lock();
      if (lk > 0) {
        const rl = (rPitch + rb0) / 2;
        g.lineWidth = 1; g.strokeStyle = 'rgba(255,205,120,0.12)'; circle(cx, cy, rl); g.stroke();
        g.globalCompositeOperation = 'lighter';
        g.lineWidth = 2.2 * sc; g.strokeStyle = 'hsla(40,95%,72%,0.7)';
        g.beginPath(); g.arc(cx, cy, rl, -Math.PI / 2, -Math.PI / 2 + Math.PI * 2 * lk); g.stroke();
        g.globalCompositeOperation = 'source-over';
      }

      // ---- центр: дышащая сфера, радиальный спектр с кругами-волнами ----
      g.globalCompositeOperation = 'lighter';
      const cr = rSpec * (0.95 + 0.25 * energy);
      const cg = g.createRadialGradient(cx, cy, 0, cx, cy, cr);
      cg.addColorStop(0, `hsla(${hue + 40},85%,62%,${0.22 + 0.18 * energy})`);
      cg.addColorStop(1, `hsla(${hue},85%,55%,0)`);
      g.fillStyle = cg; circle(cx, cy, cr); g.fill();
      g.globalCompositeOperation = 'source-over';

      s.an.getByteFrequencyData(s.bytes);
      const nb = s.bytes.length;
      if (!sp) sp = new Float32Array(M);
      for (let j = 0; j < M; j++) {
        const u = (j < M / 2 ? j : M - 1 - j) / (M / 2);
        const b0 = Math.floor(expMap(u, 2, nb * 0.55)), b1 = Math.min(nb - 1, b0 + 2);
        let a = 0; for (let b = b0; b <= b1; b++) a = Math.max(a, s.bytes[b]);
        a /= 255;
        sp[j] += (a - sp[j]) * (a > sp[j] ? 0.5 : 0.1);
      }
      if (frameN % 3 === 0) { ripples.push({ r: Float32Array.from(sp), t }); if (ripples.length > 40) ripples.shift(); }
      const life = 1.8;
      ripples = ripples.filter(rp => t - rp.t < life);
      const shape = (arr, scale) => {
        g.beginPath();
        for (let j = 0; j < M; j++) {
          const aa = -Math.PI / 2 + (j / M) * Math.PI * 2;
          const r = (rSpec + Math.pow(arr[j], 1.15) * spMax) * scale;
          const X = cx + Math.cos(aa) * r, Y = cy + Math.sin(aa) * r;
          j ? g.lineTo(X, Y) : g.moveTo(X, Y);
        }
        g.closePath();
      };
      g.lineJoin = 'round'; g.lineWidth = 1;
      for (const rp of ripples) {
        const p = (t - rp.t) / life;
        g.strokeStyle = `hsla(${hue + 30 * p},85%,72%,${0.22 * Math.pow(1 - p, 1.6)})`;
        shape(rp.r, 1 + 0.12 * p); g.stroke();
      }
      const fg = g.createRadialGradient(cx, cy, rSpec * 0.4, cx, cy, rSpec + spMax);
      fg.addColorStop(0, `hsla(${hue},85%,60%,0)`);
      fg.addColorStop(0.5, `hsla(${hue},85%,62%,0.10)`);
      fg.addColorStop(1, `hsla(${hue + 50},90%,70%,0.38)`);
      shape(sp, 1); g.fillStyle = fg; g.fill();
      g.globalCompositeOperation = 'lighter';
      g.lineWidth = 1.5 * sc; g.strokeStyle = `hsla(${hue},90%,76%,0.9)`; g.stroke();
      g.globalCompositeOperation = 'source-over';

      // ---- центр: тоника и лад ----
      g.textAlign = 'center'; g.textBaseline = 'middle';
      g.font = `${Math.round(22 * sc)}px ${FONT}`;
      g.fillStyle = 'rgba(228,240,255,0.92)';
      g.fillText(s.note(), cx, cy - 6 * sc);
      let mfs = Math.max(8, Math.round(10 * sc)), mood = s.mood();
      while (mfs > 7 && textW(mood, mfs) > rSpec * 1.7) mfs--;
      g.font = `${mfs}px ${FONT}`; g.fillStyle = 'rgba(190,215,255,0.62)';
      g.fillText(mood, cx, cy + 14 * sc);
      if (lk > 0) { g.fillStyle = 'rgba(255,215,140,0.85)'; g.fillText('залип', cx, cy + 28 * sc); }

      // ---- волны отклика на лайк и дизлайк ----
      V.pulses = V.pulses.filter(p => now - p.t0 < 1900);
      for (const p of V.pulses) {
        const q = (now - p.t0) / 1900, e = 1 - Math.pow(1 - q, 3);
        const c = p.kind === 'like' ? [165, 85, 72] : [320, 80, 74];
        g.lineWidth = (2.2 * (1 - q) + 0.6) * sc;
        g.strokeStyle = hsl(c, 0.55 * Math.pow(1 - q, 1.5));
        circle(cx, cy, lerp(rSpec * 0.7, Rout * 1.02, e)); g.stroke();
      }

      // ---- легенда ----
      if (w > 620) {
        const rows = [[COL.main, 'основной стиль'], [COL.tex, 'фон: шумы и призвуки'], [COL.par, 'параметры'], [COL.pitch, 'ступени лада'],
                      [[0, 0, 100], 'белая метка — цель, стрелка — куда идёт']];
        g.font = `10px ${FONT}`; g.textAlign = 'left'; g.textBaseline = 'middle';
        rows.forEach(([c, label], i) => {
          const y = h - 24 - (rows.length - 1 - i) * 16;
          g.fillStyle = hsl(c, 0.85); g.fillRect(20, y - 3, 6, 6);
          g.fillStyle = 'rgba(160,185,220,0.55)'; g.fillText(label, 34, y);
        });
      }
    }
    requestAnimationFrame(draw);
  })();

  let ctx, started = false;

  async function start() {
    if (started) return;
    started = true;
    ctx = new (window.AudioContext || window.webkitAudioContext)();
    if (ctx.state === 'suspended') ctx.resume();
    const sr = ctx.sampleRate;

    // ---------- шиммер: повышатель тона на +октаву (AudioWorklet из строки) ----------
    let shimNode = null;
    try {
      const code =
        "class Shifter extends AudioWorkletProcessor{" +
        "constructor(){super();this.buf=new Float32Array(16384);this.w=0;this.ph=0;this.W=2048;}" +
        "process(inputs,outputs){const inp=inputs[0][0],out=outputs[0][0];if(!inp||!out)return true;" +
        "const N=this.buf.length,W=this.W,mask=N-1;" +
        "for(let i=0;i<out.length;i++){this.buf[this.w]=inp[i];let sum=0;" +
        "for(let k=0;k<2;k++){const p=(this.ph+k*0.5)%1;const d=W*(1-p);let rp=this.w-d;if(rp<0)rp+=N;" +
        "const i0=Math.floor(rp),fr=rp-i0;" +
        "const s=this.buf[i0&mask]*(1-fr)+this.buf[(i0+1)&mask]*fr;" +
        "sum+=s*(0.5-0.5*Math.cos(2*Math.PI*p));}" +
        "out[i]=sum;this.w=(this.w+1)&mask;this.ph+=1/W;if(this.ph>=1)this.ph-=1;}return true;}}" +
        "registerProcessor('shifter',Shifter);";
      const url = URL.createObjectURL(new Blob([code], { type: 'application/javascript' }));
      await ctx.audioWorklet.addModule(url);
      shimNode = new AudioWorkletNode(ctx, 'shifter', {
        numberOfInputs: 1, numberOfOutputs: 1, channelCount: 1, channelCountMode: 'explicit', outputChannelCount: [1]
      });
    } catch (e) { shimNode = null; }

    // ---------- три цвета шума: коричневый, розовый, белый (одинаковая громкость) ----------
    const normBuf = (buf, target) => {
      for (let c = 0; c < buf.numberOfChannels; c++) {
        const d = buf.getChannelData(c);
        let s = 0; for (let i = 0; i < d.length; i++) s += d[i] * d[i];
        const k = target / Math.sqrt(s / d.length + 1e-12);
        for (let i = 0; i < d.length; i++) d[i] *= k;
      }
    };
    const mkNoise = kind => {
      const b = ctx.createBuffer(2, sr * 4, sr);
      for (let c = 0; c < 2; c++) {
        const d = b.getChannelData(c);
        let b0 = 0, b1 = 0, b2 = 0, br = 0;
        for (let i = 0; i < d.length; i++) {
          const w = Math.random() * 2 - 1;
          if (kind === 0) { br = (br + 0.02 * w) / 1.02; d[i] = br; }
          else if (kind === 1) {
            b0 = 0.99765 * b0 + w * 0.0990460;
            b1 = 0.96300 * b1 + w * 0.2965164;
            b2 = 0.57000 * b2 + w * 1.0526913;
            d[i] = b0 + b1 + b2 + w * 0.1848;
          } else d[i] = w;
        }
      }
      normBuf(b, 0.2);
      return b;
    };
    const NB = [mkNoise(0), mkNoise(1), mkNoise(2)];   // brown, pink, white

    // источник с цветом: c = 0 коричневый → 0.5 розовый → 1 белый
    const colorSrc = rate => {
      const out = ctx.createGain();
      const gains = NB.map(b => {
        const s = ctx.createBufferSource();
        s.buffer = b; s.loop = true; s.playbackRate.value = rate; s.start(0, rnd(0, 3));
        const g = ctx.createGain(); g.gain.value = 0;
        s.connect(g); g.connect(out);
        return g;
      });
      return {
        out,
        set(c, now) {
          const w = [clamp(1 - 2 * c), c < 0.5 ? 2 * c : 2 - 2 * c, clamp(2 * c - 1)];
          gains.forEach((g, i) => g.gain.setTargetAtTime(w[i], now, 0.4));

      };
    };
    const lfo = (freq, depth, target) => {
      const o = ctx.createOscillator(); o.frequency.value = freq;
      const g = ctx.createGain(); g.gain.value = depth;
      o.connect(g); g.connect(target); o.start();
      return o;
    };

    // ---------- банк форм волны ----------
    const mkWave = h => {
      const re = new Float32Array(h.length + 1), im = new Float32Array(h.length + 1);
      for (let i = 0; i < h.length; i++) im[i + 1] = h[i];
      return ctx.createPeriodicWave(re, im);
    };
    const WAVES = [
      mkWave([1]),
      mkWave([1, .5, .33, .25, .2, .16, .14, .12]),
      mkWave([1, 0, .3, 0, .15, 0, .08]),
      mkWave([1, .6, .1, .4, .05, .25]),
      mkWave([1, 0, 0, .4, 0, 0, .3, 0, 0, .2]),
      mkWave([1, .2, .7, .1, .5, .05, .3]),
      mkWave([1, 0, .5, 0, 0, .3, 0, .15]),
      mkWave([1, .9, .8, .7, .6, .5, .4, .3]),
      mkWave([1, 0, 0, 0, .5]),
      mkWave([1, .3, .1, .5, .2, .4, .1, .3]),
    ];
    const WV = { a: 0, b: 3, mix: 0.5 };

    // ---------- мастер-цепь ----------
    const mix = ctx.createGain();
    const trim = ctx.createGain(); trim.gain.value = 1;
    const hp = ctx.createBiquadFilter(); hp.type = 'highpass'; hp.frequency.value = 22;
    const comp = ctx.createDynamicsCompressor();
    comp.threshold.value = -18; comp.knee.value = 12; comp.ratio.value = 6;
    comp.attack.value = 0.01; comp.release.value = 0.3;
    const out = ctx.createGain(); out.gain.value = 0;
    mix.connect(trim); trim.connect(hp); hp.connect(comp); comp.connect(out); out.connect(ctx.destination);
    const an = ctx.createAnalyser(); an.fftSize = 2048; an.smoothingTimeConstant = 0.8;

    const layerSum = ctx.createGain();       // сумма слоёв (нормируется по числу активных)
    const dry = ctx.createGain();            // всё, что идёт в эффекты
    const dryOut = ctx.createGain();         // сухой сигнал в мастер
    layerSum.connect(dry); dry.connect(dryOut); dryOut.connect(mix);

    const B = {};
    LAYERS.forEach(n => { const g = ctx.createGain(); g.gain.value = 0; g.connect(layerSum); B[n] = g; });

    const bassOut = ctx.createGain();

      const o = ctx.createOscillator(); o.type = t; o.frequency.value = 50; o.start();
      const g = ctx.createGain(); g.gain.value = 0.28;
      o.connect(g); g.connect(bassLP);

    });

    // ---------- слой: гармонический гул (аддитивный орган из обертонов) ----------
    const humOut = ctx.createGain(); humOut.connect(B.hum);
    const humO = [], humG = [];
    for (let i = 0; i < 8; i++) {
      const o = ctx.createOscillator(); o.frequency.value = 100 * (i + 1); o.detune.value = rnd(-4, 4); o.start();
      const g = ctx.createGain(); g.gain.value = 0.2 / (i + 1);
      o.connect(g); g.connect(humOut);
      lfo(rnd(0.02, 0.2), 0.1 / Math.pow(i + 1, 0.8), g.gain);
      humO.push(o); humG.push(g);
    }

    // ---------- слой: «дыхание» (цветной шум через резонансы на обертонах) ----------
    const brOut = ctx.createGain(); brOut.connect(B.breath);
    const brSrc = colorSrc(0.8);
    const brF = [];
    for (let i = 0; i < 6; i++) {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 60; bp.frequency.value = 200 * (i + 1);
      const g = ctx.createGain(); g.gain.value = 0.5;
      brSrc.out.connect(bp); bp.connect(g); g.connect(brOut);
      lfo(rnd(0.03, 0.25), 0.25, g.gain);
      brF.push({ bp, g });
    }

    // ---------- слой: вода ----------
    const wOut = ctx.createGain(); wOut.connect(B.water);
    const wBP1 = ctx.createBiquadFilter(); wBP1.type = 'bandpass';
    const wBP2 = ctx.createBiquadFilter(); wBP2.type = 'bandpass';
    const wA1 = ctx.createGain(); wA1.gain.value = 0.55;
    const wA2 = ctx.createGain(); wA2.gain.value = 0.55;
    const wSrc1 = colorSrc(1), wSrc2 = colorSrc(0.8);
    wSrc1.out.connect(wBP1); wBP1.connect(wA1); wA1.connect(wOut);
    wSrc2.out.connect(wBP2); wBP2.connect(wA2); wA2.connect(wOut);
    const wLfo1 = lfo(4, 0.4, wA1.gain);

    const wnA = ctx.createGain(); wnA.gain.value = 0.7;

    lfo(0.05, 250, wnBP.frequency);

    // ---------- слой: металл (резонаторы на обертонах тональности) ----------
    const ratios = [1, 2.756, 5.404, 8.933, 13.34, 18.64];
    const mOut = ctx.createGain(); mOut.connect(B.metal);
    const mExc = ctx.createGain(); mExc.gain.value = 0.5;
    const mSrc = colorSrc(0.7);

    const mF = ratios.map(() => {
      const bp = ctx.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = 100;

    // ---------- слой: гранулятор (три разных источника) ----------
    const mkGrainBuf = kind => {
      const b = ctx.createBuffer(1, sr * 3, sr), d = b.getChannelData(0);
      let lp = 0, br = 0, mx = 0;
      if (kind === 0) {
        const parts = Array.from({ length: 7 }, () => ({
          f: expMap(Math.random(), 90, 2200), a: rnd(0.2, 1), m: rnd(0.2, 3), ph: rnd(0, 6.28)
        }));
        for (let i = 0; i < d.length; i++) {
          const t = i / sr;
          let s = 0;
          for (const p of parts) s += Math.sin(2 * Math.PI * p.f * t + p.ph) * p.a * (0.5 + 0.5 * Math.sin(2 * Math.PI * p.m * t));
          lp += ((Math.random() * 2 - 1) - lp) * 0.15;
          d[i] = s + lp * 3; mx = Math.max(mx, Math.abs(d[i]));
        }
      } else if (kind === 1) {
        for (let i = 0; i < d.length; i++) {

          lp += (br - lp) * 0.2;
          d[i] = lp * (0.6 + 0.4 * Math.sin(2 * Math.PI * 0.7 * i / sr)); mx = Math.max(mx, Math.abs(d[i]));

        const fs = Array.from({ length: 9 }, () => ({ f: expMap(Math.random(), 800, 7000), m: rnd(0.3, 5), ph: rnd(0, 6.28) }));
        for (let i = 0; i < d.length; i++) {
          const t = i / sr;
          let s = 0;
          for (const p of fs) s += Math.sin(2 * Math.PI * p.f * t) * Math.pow(Math.max(0, Math.sin(2 * Math.PI * p.m * t + p.ph)), 3);

      const now = ctx.currentTime;

      if (W.grain < 0.03) { nextG = now + 0.2; return; }
      const dens = expMap(P.gDens.v, 4, 60);
      const size = expMap(P.gSize.v, 0.03, 0.3);
      const center = (now * 0.03) % 1;
      const buf = gBufs[clamp(Math.floor(clamp(P.gSrc.v + gauss() * 0.08) * 3), 0, 2)];
      while (nextG < now + 0.5) {

    //          ПРОСТРАНСТВО: от глухой студии до кафедрала
    // =====================================================

      const lp = ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 2200;

        const d = b.getChannelData(c);
        let lp = 0;
        for (let i = 0; i < len; i++) {
          const t = i / len;
          lp += ((Math.random() * 2 - 1) - lp) * lerp(k0, k1, t);
          const fade = i < sr * 0.01 ? i / (sr * 0.01) : 1;

    }

      makeIR(1.1, 0.6, 0.1, 7, 0.004),
      makeIR(4, 0.9, 0.05, 6.5, 0.012),
      makeIR(12, 0.8, 0.03, 6, 0.04),

    const rG = convs.map(c => { const g = ctx.createGain(); g.gain.value = 0; c.connect(g); g.connect(mix); return g; });

    }
